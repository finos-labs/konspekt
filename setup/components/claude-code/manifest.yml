# konspekt component manifest — claude-code
#
# Installs the Claude Code operating layer: the SessionStart hook that injects
# the mandatory skills + OPERATING.md + the conversation-binding ask, the
# PreToolUse hook that refuses edits until the conversation is bound to a graph
# entity, and the skills both hooks depend on.
#
# NOT part of the konspekt standard. The portable contract is AGENTS.md (read by
# every tool); this layer is what makes ONE tool — Claude Code — enforce the
# operating envelope through hooks. Other tools get just the AGENTS.md stanza
# (nw-components-are-not-the-standard).

id: claude-code
title: Claude Code operating layer
binding: claude-code
summary: Install the Claude Code SessionStart + PreToolUse hooks and the skills
  they depend on, so Claude Code reads the instance first and refuses edits
  until the conversation is bound to an entity.

# `from` is resolved relative to this manifest, so these reach up into
# konspekt's own .claude/ — the single editable source. What lands in an
# adopter's repo is a projection of it, regenerated by
# --add claude-code --force and watched by --check. konspekt itself is the
# source, not an adopter of this component: its .claude/ is where these files
# are edited, so installing into konspekt is a self-identical no-op.
#
# settings.json is `merge: json`, not a plain projection: Claude Code fixes that
# path, so an adopter may already have one. The install MERGES the two hooks
# into any existing settings.json (de-duped on the hook command) and never
# clobbers the adopter's other settings. Because a merged file legitimately
# differs from the template, --check skips it, exactly like a seed file.
#
# The skills ship as a closed set. The five mandatory skills and the seven
# on-demand ones reference each other; shipping a partial set would leave
# dangling skill references, so the whole set travels together.
files:
  - from: ../../../.claude/settings.json
    to: .claude/settings.json
    merge: json
  - from: ../../../.claude/hooks/load-mandatory-skills.sh
    to: .claude/hooks/load-mandatory-skills.sh
  - from: ../../../.claude/hooks/require-binding.sh
    to: .claude/hooks/require-binding.sh

  # Mandatory at session start (injected by load-mandatory-skills.sh).
  - from: ../../../.claude/skills/claude-mandatory-read/SKILL.md
    to: .claude/skills/claude-mandatory-read/SKILL.md
  - from: ../../../.claude/skills/claude-precise-engineering-diction/SKILL.md
    to: .claude/skills/claude-precise-engineering-diction/SKILL.md
  - from: ../../../.claude/skills/empirical-epistemology/SKILL.md
    to: .claude/skills/empirical-epistemology/SKILL.md
  - from: ../../../.claude/skills/konspekt-atom-readiness/SKILL.md
    to: .claude/skills/konspekt-atom-readiness/SKILL.md
  - from: ../../../.claude/skills/ontology-perspective-discipline/SKILL.md
    to: .claude/skills/ontology-perspective-discipline/SKILL.md

  # On demand (referenced by the mandatory set and each other).
  - from: ../../../.claude/skills/project-agent-common/SKILL.md
    to: .claude/skills/project-agent-common/SKILL.md
  - from: ../../../.claude/skills/proof-ledger-maintenance/SKILL.md
    to: .claude/skills/proof-ledger-maintenance/SKILL.md
  - from: ../../../.claude/skills/documentation-maintenance/SKILL.md
    to: .claude/skills/documentation-maintenance/SKILL.md
  - from: ../../../.claude/skills/documentation-compaction/SKILL.md
    to: .claude/skills/documentation-compaction/SKILL.md
  - from: ../../../.claude/skills/documentation-index-curation/SKILL.md
    to: .claude/skills/documentation-index-curation/SKILL.md
  - from: ../../../.claude/skills/documentation-test-repair/SKILL.md
    to: .claude/skills/documentation-test-repair/SKILL.md
  - from: ../../../.claude/skills/code-commentary-maintenance/SKILL.md
    to: .claude/skills/code-commentary-maintenance/SKILL.md

next: |
  1. This layer applies to Claude Code only. Other tools read the AGENTS.md
     stanza, which the scaffolder already wrote.
  2. Open a Claude Code session in this repo. The SessionStart hook injects the
     mandatory skills and OPERATING.md, and asks which graph entity the
     conversation binds to before any edit.
  3. If you already had a .claude/settings.json, the two hooks were merged into
     it; your other settings were left untouched.
